[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "runtime-detector"
version = "0.1.0"
description = "TraceWeaver Runtime: a semantic memory hierarchy for coding agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Swajal Padhi" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "typer>=0.12.0",
  "rich>=13.9.0",
  "coverage>=7.6.0",
  "pytest>=8.3.0",
  "httpx>=0.27.0",
  "pyyaml>=6.0.2",
  "watchfiles>=0.24.0",
  "tree-sitter>=0.23.0",
  "tree-sitter-python>=0.23.0",
]

[project.optional-dependencies]
agentverse = [
  "uagents>=0.22.0",
]
dev = [
  "ruff>=0.6.0",
  "uagents>=0.22.0",
]

[project.scripts]
traceweaver = "traceweaver.cli:app"

[tool.setuptools.packages.find]
include = ["traceweaver*"]

[tool.setuptools.package-data]
"traceweaver.api" = ["dashboard.html"]
"traceweaver.fixtures" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
